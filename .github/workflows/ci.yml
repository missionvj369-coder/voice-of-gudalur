name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite)
        run: npm run build
        env:
                    # Placeholder-safe env so CI builds succeed without secrets.
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-session-secret-change-me' }}

      # Optional: Playwright smoke test against the built app.
      # Un-comment once E2E suites are expanded and servers are available in CI.
      # - name: E2E smoke (Playwright)
      #   run: npx playwright test --project=chromium