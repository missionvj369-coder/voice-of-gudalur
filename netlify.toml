# VOICE OF GUDALUR — static petition page ONLY.
#
# This repository intentionally contains nothing but the deployable static
# petition page (static-petition/). There is no build step: the files ship
# as-is. Nothing here invokes the retired full app — no bundler, no functions,
# no backend, no environment variables.

[build]
  # No-op so Netlify never attempts an install/build. There is deliberately no
  # package.json in this repo, so any real build command would fail.
  command = "echo 'static page deploy - no build step'"
  # Publish the static page as the site root, so /media/*, /fonts/* and the
  # petition itself resolve at the top level of voiceofgudalur.space.
  publish = "static-petition"

# ─── Headers & redirects ──────────────────────────────────────────────────────
# All caching rules and the CSP / security headers are declared in
# static-petition/_headers, which Netlify reads from the publish directory.
# Keeping them there means the host that serves the file also governs it, with
# a single source of truth.
#
# Deliberately NO [[redirects]] and NO [functions] block:
#   - the retired app's /api/* rule pointed at /.netlify/functions/api/:splat,
#     a function bundle that no longer exists in this repo;
#   - its /data/* and /stats.json rules proxied build-time JSON snapshots that
#     are gone too;
#   - its /* SPA fallback would have served this petition page for every
#     unknown URL, hiding real 404s. The page is one screen with no client
#     routes, so every miss should be a genuine 404.
#
# The petition page is fully first-party: no third-party script at all, and the
# only cross-origin surface is the YouTube iframe its film reel mounts. That
# means this deploy needs no environment variables whatsoever.

