# VOICE OF GUDALUR — Netlify configuration
[build]
  # Default deploy: build the PWA only. Migrations/seed are NOT run automatically
  # so a frontend deploy never fails because the build sandbox cannot reach the DB.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  # If the deployment environment is expected to own DB bootstrapping, use the
  # explicit combined command instead (fails fast when DATABASE_URL is missing):
  #   command = "npm run build:with-db"
  #   build:with-db = "npm run db:check && npm run db:migrate && npm run db:seed && npm run build"

# ── Build environment ───────────────────────────────────────────────
# Force npm to always install devDependencies (vite, vite-plugin-pwa,
# @vitejs/plugin-react, etc.) — they are required by the build step but
# Netlify may run with NODE_ENV=production which skips them.
# This fixes the "vite: not found" error.
[build.environment]
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "production"
  # Free-tier survival knobs:
  #   DATABASE_POOL_MAX   2 — each serverless instance keeps a tiny pool so the
  #                        total connection count stays far below CockroachDB's
  #                        free-tier ceiling when Netlify spins up many instances.
  #   MAX_IN_FLIGHT       150 — shed excess concurrent requests with a fast 503
  #                        so the function stays responsive for the users it IS
  #                        serving instead of queueing DB work that times out.
  DATABASE_POOL_MAX = "2"
  MAX_IN_FLIGHT = "150"

# ── API (Netlify Function — the Express backend itself) ─────────────────────
# server.ts#createApp() is wrapped with serverless-http in
# netlify/functions/api.ts, so the WHOLE backend (auth, petitions, config,
# CockroachDB) runs on Netlify. Required Netlify environment variables
# (Site configuration → Environment variables):
#   DATABASE_URL        CockroachDB connection string
#   SESSION_SECRET      JWT signing secret (required)
#   NODE_ENV            production  (enables secure session cookies)
#   DATABASE_POOL_MAX   5 recommended for serverless (each instance has its own pool)
#   DATABASE_SSL        optional — verify-full | require; encryption-only
#                       fallback when no CA file is present (server/db/client.ts)

[functions]
  node_bundler = "esbuild"
  # vite is only dynamically imported by the local dev server (startServer);
  # keep it out of the serverless bundle. pg-native is an optional pg binding
  # that is never used here but would otherwise fail the esbuild pass.
  external_node_modules = ["vite", "pg-native"]
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — lets /verify-docket and other client routes work on Netlify.
# Function routes (/.netlify/functions/*) always take precedence over redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Cache control ────────────────────────────────────────────────────────────
# The service worker script and the HTML entry must NEVER be cached long —
# otherwise browsers keep serving a stale app shell after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Public API read endpoints (CDN edge cache) ───────────────────────────────
# These endpoints return public, aggregate, non-personal data that is already
# cached server-side for 6–10 s (in-process TTL). The CDN caches them for an
# additional 10 s so repeat hits from the crowd are absorbed at the edge before
# they ever reach a serverless function — the single biggest free-tier win.
[[headers]]
  for = "/api/petitions/sign-stats"
  [headers.values]
    Cache-Control = "public, max-age=10, stale-while-revalidate=10"

[[headers]]
  for = "/api/petitions/ledger"
  [headers.values]
    Cache-Control = "public, max-age=10, stale-while-revalidate=10"

[[headers]]
  for = "/api/media"
  [headers.values]
    Cache-Control = "public, max-age=10, stale-while-revalidate=10"

# ─── Public aggregate/counter endpoints (healthy-cacheability, crowd-friendly) ──
# These are public, non-personal aggregate reads already TTL-cached in-process.
# The CDN edge absorbs a synchronized crowd before it reaches a serverless
# function (mirrors /api/media). Writes invalidate in-process; the edge TTL is
# short enough that counters stay fresh.
[[headers]]
  for = "/api/manifesto/stats"
  [headers.values]
    Cache-Control = "public, max-age=6, stale-while-revalidate=6"

[[headers]]
  for = "/api/wildlife/incidents"
  [headers.values]
    Cache-Control = "public, max-age=6, stale-while-revalidate=6"

[[headers]]
  for = "/api/wildlife/sightings"
  [headers.values]
    Cache-Control = "public, max-age=6, stale-while-revalidate=6"

[[headers]]
  for = "/api/wildlife/voice"
  [headers.values]
    Cache-Control = "public, max-age=6, stale-while-revalidate=6"
