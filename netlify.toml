# VOICE OF GUDALUR — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback — lets /verify-docket and other client routes work on Netlify.
# Function routes (/.netlify/functions/*) always take precedence over redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
