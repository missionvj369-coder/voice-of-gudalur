:root{--pt:#0d9488;--pg:#fbbf24;--dg:#166534;--ra:#d97706;--cb:#fafaf7;--dk:#0a0a0a;--gl:#fef3c7;--hdr:linear-gradient(135deg,#0d2818,#1a3a2a 50%,#162e1f);--glass:linear-gradient(135deg,rgba(9,22,14,.87),rgba(24,46,33,.78) 50%,rgba(16,34,23,.85));--line:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--cb);color:var(--dk);line-height:1.6}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;height:100svh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--cb)}
.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px calc(10px + env(safe-area-inset-bottom));overflow:hidden;position:relative}
.top-row{position:absolute!important;top:10px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;z-index:7}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:.98rem;letter-spacing:.12em;color:#FFFFFF;text-shadow:0 1px 6px rgba(0,0,0,.65);text-transform:uppercase;white-space:nowrap}
.top-left{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.mini-logo{display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fbf8ec;box-shadow:0 0 0 2px rgba(251,191,36,.3),0 4px 14px rgba(0,0,0,.35);flex-shrink:0}
.mini-logo img{width:100%;height:100%;object-fit:contain}
.side-social{display:flex;flex-direction:column;gap:8px}
.side-social a{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5);color:#fff;background:rgba(0,0,0,.28);transition:background .2s,transform .2s}
.side-social a:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
.side-social svg{width:14px;height:14px;fill:currentColor}
.top-cta{position:relative;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:10px 22px;border-radius:999px;color:#fff;text-decoration:none;white-space:nowrap;background:linear-gradient(135deg,var(--pt),var(--pg));box-shadow:0 3px 16px rgba(13,148,136,.5);animation:btnHeartbeat 2.2s ease-in-out infinite}
.top-cta::before{content:'';position:absolute;inset:-4px;border-radius:999px;border:2px solid rgba(251,191,36,.6);animation:sonar 2.4s ease-out infinite;pointer-events:none}
.top-cta::after{content:'';position:absolute;inset:0;border-radius:999px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:220% 100%;animation:ctaShine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes ctaShine{0%{background-position:180% 0}100%{background-position:-80% 0}}
.top-cta:hover{transform:translateY(-2px)}
.top-cta:focus-visible{outline:2px solid var(--pg);outline-offset:3px}
.center>*{position:relative;z-index:1}
/* The IMAX film: one fixed full-viewport layer behind the whole page - the
   loops run edge to edge, and the header/footer float on it as glass bars. */
.film{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#0e1811}
/* The film layer. The poster JPEG is a CSS background so the elephant-shadow
   frame is on screen from the first paint - including when a browser refuses
   autoplay (Low Power Mode), where the loop never fades in and this still is
   all the visitor sees. The loop paints on top of it once it can play. */
.bgpic{position:absolute;inset:0;width:100%;z-index:0;pointer-events:none;background:#0e1811 url(media/bg-hero.jpg) center/cover no-repeat}
.bgpic video{display:block;width:100%;height:100%;object-fit:cover;opacity:1}
.bgveil{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 50% 40%,rgba(6,10,8,0) 62%,rgba(6,10,8,.30) 100%),linear-gradient(180deg,rgba(6,10,8,.16) 0%,rgba(6,10,8,.24) 52%,rgba(6,10,8,.42) 100%);pointer-events:none}
/* Hero film: one full-bleed forest loop. Its poster frame paints instantly; the
   AV1/H.264 loop crossfades in over it once it can play, so first paint stays
   fast and the elephant shadow is on screen from the very first frame. */
.bgpic video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:saturate(1.05) contrast(1.02);transition:opacity 1.2s ease}
.bgpic video.live{opacity:.5}
@keyframes bgdrift{from{transform:scale(1)}to{transform:scale(1.08)}}
.bgpic video{animation:bgdrift 34s ease-in-out infinite alternate}
.rotator{min-height:74px;max-width:min(760px,100%);display:flex;align-items:center;justify-content:center;text-align:center}
.rotator h1{font-family:'Montserrat',sans-serif;font-size:clamp(1.02rem,4.4vw,1.7rem);font-weight:600;letter-spacing:.04em;color:#fff;line-height:1.32;transition:opacity .5s ease;text-shadow:0 2px 12px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.95)}
.rotator h1.crow{font-size:clamp(.86rem,3.5vw,1.35rem);font-weight:700}
.rotator h1.fade{opacity:0}

/* Sign CTAs: the two sign buttons and the grievance id sit in the top-right
   corner, over the film. */
.cta-stack{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.cta-stack .sign-btn{text-align:center}
.cta-gid{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:500;letter-spacing:.06em;color:#fff;line-height:1.45;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.cta-gid span{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:1px 7px;white-space:nowrap}
/* Voice: the main heading is spoken in its own language. The pill is the
   manual control and lights up while a line is being read. */
.voice-btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 15px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(0,0,0,.34);color:#fff;font-family:'Montserrat',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;flex-shrink:0;transition:background .2s,transform .2s}
.voice-btn:hover{background:rgba(255,255,255,.2)}
.voice-btn:focus-visible{outline:2px solid var(--pg);outline-offset:3px}
.voice-btn .eq{display:inline-flex;align-items:flex-end;gap:3px;height:12px}
.voice-btn .eq i{width:3px;border-radius:2px;background:linear-gradient(180deg,var(--pg),var(--pt))}
.voice-btn .eq i:nth-child(1){height:5px}
.voice-btn .eq i:nth-child(2){height:9px}
.voice-btn .eq i:nth-child(3){height:12px}
.voice-btn .eq i:nth-child(4){height:8px}
.voice-btn .eq i:nth-child(5){height:11px}
.voice-btn.on .eq i{animation:vbar 1.1s ease-in-out infinite}
.voice-btn.on .eq i:nth-child(2){animation-delay:.15s}
.voice-btn.on .eq i:nth-child(3){animation-delay:.3s}
.voice-btn.on .eq i:nth-child(4){animation-delay:.45s}
.voice-btn.on .eq i:nth-child(5){animation-delay:.6s}
.sign-btn{display:inline-block;padding:10px 32px;font-family:'Montserrat',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--pt),var(--dg) 50%,var(--pg));background-size:200% 200%;border-radius:50px;text-decoration:none;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(13,148,136,.3);animation:btnShimmer 4s ease-in-out infinite}
.sign-btn::before{content:'';position:absolute;top:0;left:-100%;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shimmer 3s ease-in-out infinite}
@keyframes btnShimmer{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes shimmer{0%{left:-100%}100%{left:100%}}
/* CTA: heartbeat + hover lift, wrapped in sonar rings that expand like sound
   waves from the mic - the "Voice of Gudalur" movement made visible. */
.sign-btn{animation:btnShimmer 4s ease-in-out infinite,btnHeartbeat 2.4s ease-in-out infinite;transition:transform .25s ease,box-shadow .25s ease}
.sign-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 28px rgba(13,148,136,.45)}
.sign-btn:active{transform:translateY(0) scale(.98)}
@keyframes btnHeartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.045)}24%{transform:scale(1)}36%{transform:scale(1.025)}50%{transform:scale(1)}}
@keyframes sonar{0%{transform:scale(2);opacity:.85}100%{transform:scale(11);opacity:0}}
/* The equalizer bars live in the voice pill now; `vbar` drives them. */
@keyframes vbar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.sign-btn:hover{letter-spacing:.16em}
/* 8K / large-display tiers: keep the IMAX composition proportional on huge panels */
@media (min-width:1500px){
.rotator h1{font-size:clamp(1.05rem,1.6vw,1.5rem)}
.rotator h1.crow{font-size:1.25rem}
.sign-btn{font-size:1.02rem;padding:11px 38px}
}
@media (min-width:1800px){
.rotator h1{font-size:clamp(1.25rem,2vw,1.85rem)}
.rotator h1.crow{font-size:1.55rem}
.sign-btn{font-size:1.15rem;padding:13px 44px}
}
@media (min-width:3000px){
.rotator h1{font-size:clamp(1.9rem,1.7vw,2.7rem)}
.rotator h1.crow{font-size:2rem}
.sign-btn{font-size:1.5rem;padding:18px 60px}
}
@media (prefers-reduced-motion:reduce){.sign-btn,.sign-btn::before,.sign-btn::after,.bgpic video,.voice-btn .eq i{animation:none!important}}
@media (max-width:640px){
  .brand-name{font-size:.78rem;letter-spacing:.08em}
  .top-cta{font-size:.62rem;padding:7px 13px;letter-spacing:.1em;box-shadow:0 2px 10px rgba(13,148,136,.45)}
  .top-row{top:8px;left:10px;right:10px}
  .mini-logo{width:36px;height:36px}
  .side-social{gap:6px}
  .side-social a{width:25px;height:25px}
  .side-social svg{width:11px;height:11px}
  .cta-stack{gap:5px}
  .cta-gid{font-size:.5rem}
}
@media (max-width:380px){
  .brand-name{font-size:.66rem}
  .brand-row{gap:7px}
  .top-cta{font-size:.56rem;padding:6px 10px}
  .mini-logo{width:32px;height:32px}
  .side-social a{width:23px;height:23px}
  .side-social svg{width:10px;height:10px}
}
/* Portrait phones: the hero film is framed wide and the elephant shadow lives
   on the right wall - slide the cover-crop onto it and lift the loop's opacity
   a touch so the shadow movement reads through the veil on small screens. */
@media (orientation:portrait){
  .bgpic video{object-position:92% 50%}
  .bgpic{background-position:92% 50%}
  .bgpic video.live{opacity:.62}
}

  <div class="rotator"><h1 id="rot" lang="ta">கூடலூர் இன்று மரண அச்சத்தில் வாழ்கிறது.</h1></div>
  <button type="button" class="voice-btn" id="voiceBtn" aria-pressed="false" aria-label="Voice / குரல்">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="vlabel">Voice &middot; குரல்</span>
  </button>

</div>

<script>
/* One screen: the main heading rotates through all four languages, then the
   death-toll heading in the same four languages, and every line is read out
   loud in its own language. A browser only starts audio after a gesture, so
   the first tap anywhere (or the pill under the heading) arms the voice. */
(function(){
  var heads = [
    'கூடலூர் இன்று மரண அச்சத்தில் வாழ்கிறது.',
    'Gudalur is living in fear.',
    'ഗൂഡല്ലൂർ ഇന്ന് മരണഭീതിയിലാണ്.',
    'ಗೂಡಲೂರು ಇಂದು ಮರಣ ಭೀತಿಯಲ್ಲಿ ಬದುಕುತ್ತಿದೆ.',
    'கூடலூர்: 95 உயிர்கள் பலி | தமிழ்நாடு: 720 | இந்தியா: 7,868 (2009–2025)',
    'GUDALUR: 95 LIVES LOST | TAMIL NADU: 720 | INDIA: 7,868 (2009–2025)',
    'ഗൂഡല്ലൂർ: 95 ജീവനുകൾ നഷ്ടം | തമിഴ്നാട്: 720 | ഇന്ത്യ: 7,868 (2009–2025)',
    'ಗೂಡಲೂರು: 95 ಜೀವಗಳು ನಷ್ಟ | ತಮಿಳುನಾಡು: 720 | ಭಾರತ: 7,868 (2009–2025)'
  ];
  var LANGS = ['ta-IN', 'en-IN', 'ml-IN', 'kn-IN', 'ta-IN', 'en-IN', 'ml-IN', 'kn-IN'];
  // Per-headline dwell: 7 s for the fear lines, 9 s for the longer toll lines.
  var DUR = [7000, 7000, 7000, 7000, 9000, 9000, 9000, 9000];
  var N = heads.length, idx = 0, timer = null;
  var rot = document.getElementById('rot');
  var voiceBtn = document.getElementById('voiceBtn');
  var tts = window.speechSynthesis ? window : null;
  var voices = [];
  var voiceOn = !!tts;    // try to speak as soon as the page opens
  var started = false;    // true once a line has actually been heard

  function loadVoices(){
    if (!tts) return;
    try { voices = window.speechSynthesis.getVoices() || []; } catch(e){}
  }
  if (tts) {
    loadVoices();
    if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    else window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  /* Pick a real voice for the language - without this the browser silently
     reads Tamil / Malayalam / Kannada with the English default voice. */
  function pickVoice(tag){
    var pre = tag.split('-')[0].toLowerCase(), i;
    for (i = 0; i < voices.length; i++) if (voices[i].lang.toLowerCase() === tag.toLowerCase()) return voices[i];
    for (i = 0; i < voices.length; i++) if (voices[i].lang.toLowerCase().indexOf(pre) === 0) return voices[i];
    return null;
  }
  function mark(on){
    if (!voiceBtn) return;
    voiceBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    voiceBtn.className = on ? 'voice-btn on' : 'voice-btn';
  }
  function say(){
    if (!tts || !voiceOn) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(heads[idx]);
      u.lang = LANGS[idx];
      u.rate = 0.95;
      u.pitch = 1;
      var v = pickVoice(u.lang);
      if (v) u.voice = v;
      u.onstart = function(){ started = true; mark(true); };
      u.onend = function(){ mark(false); };
      u.onerror = function(){ mark(false); };
      window.speechSynthesis.speak(u);
    } catch(e){ mark(false); }
  }
  function render(){
    rot.setAttribute('lang', LANGS[idx].split('-')[0]);
    rot.classList.toggle('crow', idx >= 4);
    rot.classList.add('fade');
    setTimeout(function(){
      rot.textContent = heads[idx];
      rot.classList.remove('fade');
      say();
    }, 260);
  }
  function go(){ idx = (idx + 1) % N; render(); timer = setTimeout(go, DUR[idx]); }
  /* A link click means the visitor is leaving, and the pill runs its own
     handler - neither should trigger the retry twice. */
  function kick(e){
    if (e && e.target && e.target.closest && e.target.closest('a, #voiceBtn')) return;
    if (voiceOn && !started) say();
  }

  if (voiceBtn) voiceBtn.addEventListener('click', function(){
    if (!tts) return;
    voiceOn = !voiceOn;
    if (voiceOn) { say(); } else { window.speechSynthesis.cancel(); mark(false); }
  });
  /* If the browser blocked the automatic voice, the first gesture arms it. */
  document.addEventListener('touchstart', kick, { once: true, passive: true });
  document.addEventListener('click', kick, { once: true });
  document.addEventListener('keydown', kick, { once: true });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) kick(); });
  /* Nothing heard after the first line: the pill stays as the manual way in. */
  setTimeout(function(){ if (!started) mark(false); }, 1600);

  render();
  timer = setTimeout(go, DUR[idx]);
})();
</script>

<script>
/* Hero background film: the poster (a CSS background on .bgpic) paints
   instantly and the muted loop starts right away (no load defer) so the film is
   visible while the page loads. Reduced-motion users keep the poster frame. */
(function(){
  var vids = [].slice.call(document.querySelectorAll('.bgvid'));
  if (!vids.length) return;
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  vids.forEach(function(v){
    v.addEventListener('playing', function(){ v.className = 'bgvid live'; }, {once:true});
  });
  if (reduce) {
    /* Keep the still: the autoplay attribute may already be running the loop,
       so stop it before it ever gets the `.live` crossfade. */
    vids.forEach(function(v){
      try { v.removeAttribute('autoplay'); v.autoplay = false; v.pause(); } catch(e){}
    });
    return;
  }
  vids.forEach(function(v){
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  });
  /* Some mobile in-app browsers hold autoplay until a gesture: retry the hero
     loop on the first touch and whenever the tab becomes visible again. */
  function kick(){
    vids.forEach(function(v){ if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); } });
  }
  document.addEventListener('touchstart', kick, { once: true, passive: true });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) kick(); });
})();
</script>
